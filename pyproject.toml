[project]
name = "ccarf-lab"
version = "0.1.0"
description = "Hands-on exercises for the Claude Certified Architect exam: agents, MCP tools, hooks and structured extraction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "claude-agent-sdk>=0.2.172",
    "fastapi>=0.161.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ex1_support_agent", "ex2_extraction", "ex4_research"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the real Claude API and cost money: run them with `uv run pytest -m live`.
addopts = '-m "not live"'
markers = ["live: calls the real Claude API (costs money; needs .env)"]

[tool.coverage.run]
source = ["ex1_support_agent", "ex2_extraction", "ex4_research"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle errors and warnings
    "F",       # pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "N",       # pep8-naming
    "UP",      # pyupgrade: modern syntax for the target version
    "B",       # bugbear: likely bugs and design problems
    "SIM",     # simplify
    "S",       # bandit: security checks
    "PT",      # pytest style
    "RUF",     # ruff-specific rules
]
# The exercise prescribes names like BackendTimeout and PolicyViolation.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Test functions take pytest fixtures and need no return annotations.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
